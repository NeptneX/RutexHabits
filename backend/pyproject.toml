[project]
name = "habit-tracker-backend"
version = "0.1.0"
description = "API REST para seguir rutinas, hábitos y peso corporal"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Dependencias solo para desarrollo: se instalan con  pip install -e ".[dev]"
dev = [
    "pytest>=8",
    "httpx>=0.27",  # TestClient de FastAPI lo necesita
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
